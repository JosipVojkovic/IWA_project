<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #09090f;
        --surface: #12121c;
        --surface2: #1a1a28;
        --border: rgba(255,255,255,0.07);
        --gold: #e8b84b;
        --gold-dim: rgba(232,184,75,0.12);
        --text: #f0eff8;
        --muted: #7a7a94;
        --danger: #f87171;
      }

      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80vw 60vh at 20% -10%, rgba(232,184,75,0.06) 0%, transparent 60%),
          radial-gradient(ellipse 60vw 50vh at 80% 110%, rgba(99,102,241,0.05) 0%, transparent 55%);
        pointer-events: none;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 36px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      }

      .brand {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.8rem;
        letter-spacing: 0.08em;
        color: var(--gold);
        text-align: center;
        display: block;
        margin-bottom: 6px;
        text-decoration: none;
      }

      .brand span { color: var(--text); }

      .subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 0.875rem;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9rem;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 16px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input::placeholder { color: var(--muted); }

      input:focus {
        border-color: rgba(232,184,75,0.4);
        box-shadow: 0 0 0 3px rgba(232,184,75,0.08);
      }

      .btn-submit {
        width: 100%;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--bg);
        background: var(--gold);
        border: none;
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        margin-top: 8px;
        transition: opacity 0.2s, transform 0.15s;
      }

      .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }

      .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .footer-link a {
        color: var(--gold);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-link a:hover { text-decoration: underline; }

      .error-msg {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: 6px;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a href="#" class="brand">Cine<span>Vault</span></a>
      <p class="subtitle">Sign in to access the collection</p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" placeholder="Your username" required />
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" placeholder="••••••••" required />
        </div>

        {% if form.non_field_errors %}
        <div class="error-msg">{{ form.non_field_errors }}</div>
        {% endif %}

        <button type="submit" class="btn-submit">Sign in</button>
      </form>

      <div class="divider"></div>

      <p class="footer-link">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
    </div>
  </body>
</html>
