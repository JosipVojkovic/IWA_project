{% load static %}
<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'movies/css/auth.css' %}" />
  </head>
  <body>
    <div class="card">
      <a href="#" class="brand">Cine<span>Vault</span></a>
      <p class="subtitle">Sign in to access the collection</p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" placeholder="Your username" required />
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" placeholder="••••••••" required />
        </div>

        {% if form.non_field_errors %}
        <div class="error-msg">{{ form.non_field_errors }}</div>
        {% endif %}

        <button type="submit" class="btn-submit">Sign in</button>
      </form>

      <div class="divider"></div>

      <p class="footer-link">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
    </div>
  </body>
</html>
