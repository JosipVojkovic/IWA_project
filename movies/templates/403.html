{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault — Forbidden</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'movies/css/auth.css' %}" />
    <style>
      body { flex-direction: column; gap: 0; }
      .card { text-align: center; }
      .error-code {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 6rem;
        color: var(--gold);
        line-height: 1;
        margin-bottom: 8px;
      }
      .error-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }
      .error-desc {
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 32px;
      }
      .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn-primary {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--bg);
        background: var(--gold);
        border: none;
        border-radius: 10px;
        padding: 10px 24px;
        text-decoration: none;
        transition: opacity 0.2s, transform 0.15s;
      }
      .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); color: var(--bg); }
      .btn-secondary {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 24px;
        text-decoration: none;
        transition: color 0.2s, border-color 0.2s;
      }
      .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="error-code">403</div>
      <div class="error-title">Access Forbidden</div>
      <p class="error-desc">You don't have permission to view this page.</p>
      <div class="btn-group">
        <a href="{% url 'movie_list' %}" class="btn-primary">Go to movies</a>
        <a href="{% url 'logout' %}" class="btn-secondary">Logout</a>
      </div>
    </div>
  </body>
</html>
